name: Frontend QA — Build e Testes Automatizados

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'
      - 'ci/**'
    paths:
      - 'web/**'
      - '.github/workflows/**'

  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'web/**'
      - '.github/workflows/**'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-frontend:
    name: Build e Suite de Testes QA (Frontend)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22 e cache npm
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Provisionar dependencias do Frontend
        run: npm ci --no-audit --no-fund

      - name: Executar analise estatica (Lint)
        run: npm run lint --if-present

      - name: Executar suite de testes QA (Vitest / React Testing Library)
        run: npm test

      - name: Build e validacao de compilacao do Frontend
        run: npm run build

      - name: Publicar relatorios e artefatos QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-frontend-test-reports
          path: |
            web/coverage/**
            web/dist/**
          if-no-files-found: warn
